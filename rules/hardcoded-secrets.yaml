# Hardcoded Secrets (CWE-798/321)
id: JL-S009
name: Hardcoded Secrets
severity: high
description: "Detects hardcoded passwords, API keys, or secret keys in source code (CWE-798)"
signaturePatterns:
  - "javax.crypto.spec.SecretKeySpec.SecretKeySpec(*)"
  - "javax.crypto.spec.DESKeySpec.DESKeySpec(*)"
  - "javax.crypto.spec.DESedeKeySpec.DESedeKeySpec(*)"
checkScript: "hardcoded-secrets.js"
tags:
  - security
  - secrets
  - hardcoded